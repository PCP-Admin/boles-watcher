name: Generate Free RSS Feed

on:
  schedule:
    - cron: '*/30 * * * *' # Automatically updates your RSS feed file every 30 minutes
  workflow_dispatch: # Lets you push a button to manually force an update

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scrape Facebook and Build XML File
        run: |
          python -c '
          import urllib.request
          import re
          import datetime
          import html

          pages = ["BolesBulldogsAthletics", "bolesjh"]
          all_items_xml = ""

          for page in pages:
              # Disguise the script request headers perfectly to mimic Google Chrome
              req = urllib.request.Request(
                  f"https://www.facebook.com/{page}",
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9"
                  }
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      page_html = response.read().decode("utf-8")
                  
                  # Target raw text definitions hidden inside Meta script tags
                  matches = re.findall(r"\"text\":\"([^\"]+)\"", page_html)
                  if not matches:
                      continue

                  # Filter out structural button noise strings 
                  valid_posts = [p for p in matches if len(p) > 20 and not any(x in p for x in ["log in", "create account", "privacy", "cookie"])]
                  
                  if valid_posts:
                      # Decode unicode markers smoothly (\u0020, etc.)
                      raw_text = valid_posts[0].encode().decode("unicode-escape").replace("\\n", "\n")
                      clean_text = html.escape(raw_text)

                      now = datetime.datetime.now().strftime("%a, %d %b %Y %H:%M:%S GMT")
                      
                      all_items_xml += f"""
                      <item>
                        <title>New Update from {page}</title>
                        <description>{clean_text}</description>
                        <link>https://www.facebook.com/{page}</link>
                        <pubDate>{now}</pubDate>
                      </item>"""

              except Exception as e:
                  print(f"Error processing page {page}: {e}")

          now_global = datetime.datetime.now().strftime("%a, %d %b %Y %H:%M:%S GMT")
          rss_content = f"""<?xml version="1.0" encoding="UTF-8" ?>
          <rss version="2.0">
          <channel>
            <title>Boles Junior High Sports Alerts</title>
            <link>https://www.facebook.com/bolesjh</link>
            <description>Self-hosted Facebook RSS stream for parents.</description>
            <pubDate>{now_global}</pubDate>
            {all_items_xml}
          </channel>
          </rss>"""

          with open("feed.xml", "w", encoding="utf-8") as f:
              f.write(rss_content)
          print("Successfully generated aggregated feed.xml file!")
          '

      - name: Publish XML File Live to the Internet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml || true
          git commit -m "Update live RSS XML feed [skip ci]" || true
          git push || true

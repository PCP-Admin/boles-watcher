name: Generate Campus News RSS

on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Campus News from aisd.net and write feed.xml
        run: |
          set -euo pipefail
          python3 << 'PY'
          import html
          import re
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from html.parser import HTMLParser

          SOURCE = "https://www.aisd.net/boles-junior-high/"
          UA = (
              "Mozilla/5.0 (compatible; boles-watcher/2.0; "
              "+https://github.com/PCP-Admin/boles-watcher)"
          )

          class ItemParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items = []
                  self._cur = None
                  self._in_desc = False
                  self._buf = []

              def _flush(self):
                  if self._cur is not None:
                      self.items.append(self._cur)
                  self._cur = None
                  self._in_desc = False
                  self._buf = []

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  classes = d.get("class", "")
                  if tag == "div" and "cff-item" in classes.split() and d.get("id", "").startswith("cff_"):
                      self._flush()
                      self._cur = {
                          "id": d.get("id", ""),
                          "ts": d.get("data-cff-timestamp", ""),
                          "text": "",
                          "link": "",
                      }
                      return
                  if self._cur is None:
                      return
                  if tag == "span" and "cff-post-desc" in classes.split():
                      self._in_desc = True
                      self._buf = []
                  if tag == "br" and self._in_desc:
                      self._buf.append("\n")
                  if tag == "a" and self._in_desc and d.get("href"):
                      self._buf.append(" ")
                      self._buf.append(d["href"])
                      self._buf.append(" ")
                  if tag == "a" and "cff-viewpost-facebook" in classes.split() and d.get("href"):
                      self._cur["link"] = d["href"]

              def handle_startendtag(self, tag, attrs):
                  if self._in_desc and tag == "br":
                      self._buf.append("\n")

              def handle_endtag(self, tag):
                  if tag == "span" and self._in_desc:
                      text = html.unescape("".join(self._buf))
                      text = re.sub(r"[ \t]+", " ", text)
                      text = re.sub(r"\n{3,}", "\n\n", text).strip()
                      if self._cur is not None:
                          self._cur["text"] = text
                      self._in_desc = False
                      self._buf = []

              def handle_data(self, data):
                  if self._in_desc:
                      self._buf.append(data)

              def close(self):
                  self._flush()
                  super().close()

          req = urllib.request.Request(
              SOURCE, headers={"User-Agent": UA, "Accept": "text/html"}
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              print(f"GET {SOURCE} -> HTTP {resp.status}")
              raw = resp.read().decode("utf-8", errors="replace")

          print(f"cff-item markers in HTML: {raw.count('class=\"cff-item')}")

          parser = ItemParser()
          parser.feed(raw)
          parser.close()

          seen = set()
          posts = []
          for it in parser.items:
              key = it["id"] or it["link"] or it["text"]
              if not key or key in seen:
                  continue
              if not it["text"] and not it["link"]:
                  continue
              seen.add(key)
              posts.append(it)

          print(f"Parsed posts: {len(posts)}")
          for p in posts:
              preview = (p["text"] or "")[:90].replace("\n", " ")
              print(f"- {p['id']} {preview!r}")

          def rfc822(ts):
              try:
                  return format_datetime(datetime.fromtimestamp(int(ts), tz=timezone.utc))
              except (TypeError, ValueError):
                  return format_datetime(datetime.now(timezone.utc))

          def first_line(text, limit=90):
              line = re.sub(r"\s+", " ", (text or "Campus update").split("\n", 1)[0]).strip()
              if len(line) > limit:
                  line = line[: limit - 1].rstrip() + "…"
              return line or "Campus update"

          now = datetime.now(timezone.utc)
          rss = ET.Element("rss", attrib={"version": "2.0"})
          ch = ET.SubElement(rss, "channel")
          ET.SubElement(ch, "title").text = "Boles Junior High Campus News"
          ET.SubElement(ch, "link").text = SOURCE
          ET.SubElement(ch, "description").text = (
              "Campus News from aisd.net/boles-junior-high "
              "(Facebook posts the school republishes on the website)."
          )
          ET.SubElement(ch, "lastBuildDate").text = format_datetime(now)
          ET.SubElement(ch, "pubDate").text = format_datetime(now)

          for p in posts:
              item = ET.SubElement(ch, "item")
              ET.SubElement(item, "title").text = first_line(p["text"])
              ET.SubElement(item, "description").text = p["text"]
              link = p["link"] or SOURCE
              ET.SubElement(item, "link").text = link
              guid = ET.SubElement(item, "guid")
              guid.set("isPermaLink", "false")
              guid.text = p["id"] or link
              ET.SubElement(item, "pubDate").text = rfc822(p["ts"])

          tree = ET.ElementTree(rss)
          ET.indent(tree, space="  ")
          tree.write("feed.xml", encoding="utf-8", xml_declaration=True)
          print(f"Wrote feed.xml with {len(posts)} items")
          if not posts:
              sys.exit(1)
          PY

      - name: Publish feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "No change to feed.xml"
            exit 0
          fi
          git commit -m "Update campus news RSS [skip ci]"
          git push

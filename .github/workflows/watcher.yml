name: Generate Free RSS Feed

on:
  schedule:
    # Every 2 hours. 30 minutes will get public RSSHub instances rate-limited.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch page feeds and build feed.xml
        env:
          PAGES: "BolesBulldogsAthletics bolesjh"
          RSSHUB_BASE: "https://rsshub.app"
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          import sys
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          pages = os.environ["PAGES"].split()
          base = os.environ["RSSHUB_BASE"].rstrip("/")
          ua = "Mozilla/5.0 (compatible; boles-watcher/1.0; +https://github.com/PCP-Admin/boles-watcher)"
          items = []

          def fetch(url: str) -> bytes:
              req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "application/rss+xml, application/xml, text/xml, */*"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(f"GET {url} -> HTTP {resp.status} {resp.getheader('Content-Type', '')}")
                  return resp.read()

          for page in pages:
              url = f"{base}/facebook/page/{page}"
              try:
                  raw = fetch(url)
              except urllib.error.HTTPError as e:
                  body = e.read()[:500]
                  print(f"FAIL {page}: HTTP {e.code}\n{body!r}")
                  continue
              except Exception as e:
                  print(f"FAIL {page}: {type(e).__name__}: {e}")
                  continue

              preview = raw[:400].decode("utf-8", errors="replace")
              print(f"--- preview {page} ---\n{preview}\n---")

              try:
                  root = ET.fromstring(raw)
              except ET.ParseError as e:
                  print(f"NOT XML for {page}: {e}")
                  continue

              channel = root.find("channel")
              if channel is None:
                  print(f"No <channel> in response for {page}")
                  continue

              found = channel.findall("item")
              print(f"{page}: parsed {len(found)} <item> elements")
              items.extend(found)

          now = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S GMT")
          rss = ET.Element("rss", attrib={"version": "2.0"})
          ch = ET.SubElement(rss, "channel")
          ET.SubElement(ch, "title").text = "Boles Junior High Sports Alerts"
          ET.SubElement(ch, "link").text = "https://www.facebook.com/bolesjh"
          ET.SubElement(ch, "description").text = "Self-hosted Facebook RSS stream for parents."
          ET.SubElement(ch, "lastBuildDate").text = now
          ET.SubElement(ch, "pubDate").text = now

          for it in items:
              ch.append(it)

          tree = ET.ElementTree(rss)
          ET.indent(tree, space="  ")
          tree.write("feed.xml", encoding="utf-8", xml_declaration=True)
          print(f"Wrote feed.xml with {len(items)} items")
          if not items:
              print("WARNING: channel has no items. RSSHub likely returned HTML, an error page, or an empty Facebook route.")
              sys.exit(0)
          PY

      - name: Publish XML File Live to the Internet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "No change to feed.xml"
            exit 0
          fi
          git commit -m "Update live RSS XML feed [skip ci]"
          git push

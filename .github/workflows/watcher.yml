name: Generate Free RSS Feed

on:
  schedule:
    - cron: '*/30 * * * *' # Automatically updates your RSS feed file every 30 minutes
  workflow_dispatch: # Lets you push a button to manually force an update

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Clean Data and Build XML File
        run: |
          # Wake up and create a blank layout file to compile the item data blocks
          echo "" > items.txt

          # Loop directly through your target Facebook account endpoints
          for page in BolesBulldogsAthletics bolesjh; do
            echo "Processing page: $page"
            
            # Use an open-source data gateway to safely read Meta posts without getting blocked
            curl -s -L -A "Mozilla/5.0" "https://rsshub.app" > raw_feed.xml
            
            # Isolate and clean the single newest post text body string from the output loop
            grep -oP '(?<=<description><!\[CDATA\[).*?(?=\]\]></description>)' raw_feed.xml | head -n 1 > post_text.txt
            sed -i 's/<[^>]*>//g' post_text.txt # Wipe away any messy web link tags
            
            LIVE_POST=$(cat post_text.txt)
            
            # Assemble the structured RSS block if valid text information is pulled
            if [ ! -z "$LIVE_POST" ]; then
              NOW=$(date -u +"%a, %d %b %Y %H:%M:%S GMT")
              echo "<item>" >> items.txt
              echo "  <title>New Update from $page</title>" >> items.txt
              echo "  <description>$LIVE_POST</description>" >> items.txt
              echo "  <link>https://facebook.com</link>" >> items.txt
              echo "  <pubDate>$NOW</pubDate>" >> items.txt
              echo "</item>" >> items.txt
            fi
          done

          # Combine the system tags and compiled item blocks into a unified output file
          ALL_ITEMS=$(cat items.txt)
          NOW_GLOBAL=$(date -u +"%a, %d %b %Y %H:%M:%S GMT")
          
          cat <<EOF > feed.xml
          <?xml version="1.0" encoding="UTF-8" ?>
          <rss version="2.0">
          <channel>
            <title>Boles Junior High Sports Alerts</title>
            <link>https://www.facebook.com/bolesjh</link>
            <description>Self-hosted Facebook RSS stream for parents.</description>
            <pubDate>$NOW_GLOBAL</pubDate>
            $ALL_ITEMS
          </channel>
          </rss>
          EOF
          print("Successfully generated aggregated feed.xml file!")

      - name: Publish XML File Live to the Internet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add feed.xml || true
          git commit -m "Update live RSS XML feed [skip ci]" || true
          git push || true

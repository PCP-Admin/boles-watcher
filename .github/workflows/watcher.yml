name: Generate Free RSS Feed

on:
  schedule:
    - cron: '0 * * * *' # Automatically updates your RSS feed file every hour
  workflow_dispatch: # Lets you push a button to manually force an update

permissions:
  contents: write

jobs:
  build-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scrape Facebook and Build XML File
        run: |
          python -c '
          import urllib.request
          import re
          import datetime
          import html

          # Fetch public data from Boles JH Facebook
          req = urllib.request.Request(
              "https://facebook.com",
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  page_html = response.read().decode("utf-8")
              
              # Extract latest text posts from the backend data layout
              matches = re.findall(r"\"text\":\"([^\"]+)\"", page_html)
              if not matches:
                  print("No text found.")
                  exit(0)

              # Filter for meaningful updates
              valid_posts = [p for p in matches if len(p) > 15 and any(k in p for k in ["Boles", "Junior", "game", "sports", "school", "practice"])]
              live_post = valid_posts[0] if valid_posts else matches[0]
              
              # Clean up messy unicode symbols
              live_post = live_post.encode().decode("unicode-escape").replace("\\n", "\n")
              clean_text = html.escape(live_post)

              # Format the actual XML RSS structure
              now = datetime.datetime.now().strftime("%a, %d %b %Y %H:%M:%S GMT")
              rss_content = f"""<?xml version="1.0" encoding="UTF-8" ?>
              <rss version="2.0">
              <channel>
                <title>Boles Junior High Sports Alerts</title>
                <link>https://facebook.com</link>
                <description>Self-hosted Facebook RSS stream for parents.</description>
                <pubDate>{now}</pubDate>
                <item>
                  <title>New Update from Boles JH</title>
                  <description>{clean_text}</description>
                  <link>https://facebook.com</link>
                  <pubDate>{now}</pubDate>
                </item>
              </channel>
              </rss>"""

              # Save it directly into the repository as a hosted web file
              with open("feed.xml", "w", encoding="utf-8") as f:
                f.write(rss_content)
              print("Successfully generated feed.xml file!")

          except Exception as e:
              print(f"Error: {e}")
          '

      - name: Publish XML File Live to the Internet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add feed.xml || true
          git commit -m "Update live RSS XML feed [skip ci]" || true
          git push || true

name: Facebook Watcher

on:
  schedule:
    - cron: '0 * * * *' # Wakes up automatically every single hour
  workflow_dispatch: # Allows you to press a button to force-test it

permissions:
  contents: write # Grants permission to update the text checkpoint tracking file

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Clean Facebook Data
        run: |
          # Uses the open-source RSSHub engine to cleanly extract BolesJH text data
          curl -s -L -A "Mozilla/5.0" "https://rsshub.app" > feed.xml
          
          # Extracts the most recent post text content from the clean data loop
          grep -oP '(?<=<description><!\[CDATA\[).*?(?=\]\]></description>)' feed.xml | head -n 1 > live_post.txt
          
          # Cleans up any messy system HTML fragments from the raw string
          sed -i 's/<[^>]*>//g' live_post.txt
          
          echo "CURRENT_POST=$(cat live_post.txt | head -c 200)" >> $GITHUB_ENV

      - name: Compare and Broadcast to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Checks for your tracking checkpoint log
          if [ -f tracking.txt ]; then
            LAST_POST=$(cat tracking.txt)
          else
            LAST_POST=""
          fi
          
          LIVE_POST=$(cat live_post.txt)
          
          # Only executes the notification if the new post text contains data and is new
          if [ ! -z "$LIVE_POST" ] && [ "$LIVE_POST" != "$LAST_POST" ]; then
            curl -s -X POST "https://telegram.org" \
              -d "chat_id=$CHAT_ID" \
              -d "text=🐾 NEW BOLES JH POST:%0A%0A$LIVE_POST%0A%0A🔗 Link: https://www.facebook.com/bolesjh"
            
            echo "$LIVE_POST" > tracking.txt
          fi

      - name: Save Tracking State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking.txt || true
          git commit -m "Update tracking checkpoint [skip ci]" || true
          git push || true
